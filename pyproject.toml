[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fcomp"
version = "0.1.0.dev0"
description = "包容你的编译器：合法代码原生直通，出错或自然语言时在预算内修复并真实执行。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "五秋望田", email = "wuqiuwangtian@users.noreply.github.com" }]
keywords = ["compiler", "llm", "error-repair", "cli", "ai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
fcomp = "fcomp.cli:main"

[project.urls]
Homepage = "https://github.com/wuqiuwangtian/forgiving-compiler"
Repository = "https://github.com/wuqiuwangtian/forgiving-compiler"
Issues = "https://github.com/wuqiuwangtian/forgiving-compiler/issues"
Changelog = "https://github.com/wuqiuwangtian/forgiving-compiler/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fcomp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/fcomp",
  "/tests",
  "/docs",
  "/.github",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["fcomp"]
branch = true
