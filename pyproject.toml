[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yescc"
version = "0.1.0rc3"
description = "YesCC：永不扫兴的 AI 编译器。合法代码原样编译，错误与自然语言尽量变成可运行程序。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "五秋望田", email = "wuqiuwangtian@users.noreply.github.com" }]
keywords = ["compiler", "llm", "error-repair", "cli", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4.2",
  "tree-sitter>=0.25",
  "tree-sitter-c>=0.24",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
yescc = "yescc.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/wuqiuwangtian/yescc"
Repository = "https://github.com/wuqiuwangtian/yescc"
Issues = "https://github.com/wuqiuwangtian/yescc/issues"
Changelog = "https://github.com/wuqiuwangtian/yescc/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/yescc"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/yescc",
  "/tests",
  "/docs",
  "/bench",
  "/examples",
  "/.github",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/uv.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/AGENTS.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: 端到端测试（需要真实工具链）"]

[tool.coverage.run]
source = ["yescc"]
branch = true
