name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not e2e"
      - name: CLI smoke test
        run: uv run yescc --version

  e2e:
    name: e2e (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Verify toolchains
        run: |
          gcc --version
          node --version
      - run: uv run pytest -m e2e
        env:
          YESCC_TEST_EVIDENCE_DIR: ${{ github.workspace }}/dist/undefined-check-evidence
      - name: M4 offline benchmark (no model requests)
        run: uv run python -m bench.harness --output dist/m4-offline.json
      - name: M5 failure audit and independent oracle checks
        run: |
          uv run python -m bench.failure_audit --output dist/m5-failure-audit.json
          uv run python -m bench.oracle_checks --output dist/m5-oracle-crosscheck.json
      - name: Retain benchmark evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: m4-${{ runner.os }}-py${{ matrix.python }}
          path: |
            dist/m4-offline.json
            dist/m5-*.json
            dist/undefined-check-evidence/*.json

  package:
    name: package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv build
      - name: Clean wheel install, CLI paths and license inventory
        run: uv run python -m bench.package_smoke --output dist/package-smoke.json
      - name: Retain RC package evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rc-package-${{ runner.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/package-smoke.json
